# Supply-chain hardening: see `scripts/check-deps.ts` for the rules
# this project enforces on top of these defaults.
[install]
# `bun add <pkg>` writes an exact version into package.json instead of a caret range.
# Every dependency must be pinned; the audit script fails CI otherwise.
exact = true

# Quarantine newly-published versions. A compromised package is almost always
# yanked within hours of detection, so refusing to install anything younger
# than this window blocks the typical supply-chain attack window without
# meaningfully slowing legitimate upgrades. Value is in seconds (7 days).
minimumReleaseAge = 604800

# No blanket excludes. If a specific package ever needs to bypass the gate,
# pin it with `name@version` so the bypass is scoped to a single release.
minimumReleaseAgeExcludes = []

# Keep the human-readable text lockfile (default in Bun 1.2+); it diffs
# cleanly in code review so supply-chain changes are visible.
saveTextLockfile = true

# Default-secure for postinstall scripts: Bun only runs lifecycle scripts
# for packages explicitly listed in `trustedDependencies` in package.json
# (plus Bun's built-in allowlist). Leaving this `false` keeps the explicit
# allowlist active; setting it to `true` would break @discordjs/opus's
# native build.
ignoreScripts = false

[test]
preload = ["./tests/setup.ts"]
